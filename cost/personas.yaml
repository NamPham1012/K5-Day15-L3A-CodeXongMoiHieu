# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật — cửa hàng cho thuê áo dài nhỏ tại Hòa Lạc, track F
                    # Quy mô: 1 chủ tiệm đang dùng (P1.md); scale ra: các tiệm thuê áo dài nhỏ tại HN
  low: 1
  base: 5
  high: 20
  source: "P1.md — phỏng vấn trực tiếp 1 chủ tiệm Hòa Lạc 27/11/2026; thấp=chỉ chủ tiệm đó; cơ sở=5 tiệm (tự ước tính: cùng quy mô phố Hòa Lạc); cao=20 tiệm (tự ước tính: nhân rộng ra khu vực)"

personas:           # 3 kiểu người dùng theo tần suất dùng; share cộng lại = 1.0
  - name: hoi_thuong
    share: 0.5
    uses_per_month: 60
    turns_per_session: 2
    source: "P1.md — chủ tiệm cho biết khoảng 150 lượt hỏi/tháng, một nửa là hỏi đơn giản 1-2 câu (tự ước tính từ spec.md §2: ~5 lượt/ngày × 30 ngày)"
    types: [thuong]

  - name: kiem_tra_kho
    share: 0.35
    uses_per_month: 40
    turns_per_session: 3
    source: "P1.md — khoảng 1/3 lượt hỏi liên quan kiểm tra lịch phức tạp (tình trạng trùng, thiếu size), ước tính từ 5 nhóm vượt tồn kho trong data-mining.md (tự ước tính)"
    types: [kho]

  - name: xu_ly_biet_le
    share: 0.15
    uses_per_month: 15
    turns_per_session: 4
    source: "data-mining.md — 37.9% dòng lịch bất thường; ước tính 15% phiên gặp tình huống đặc biệt: nhầm giờ, từ chối đơn, trả muộn (tự ước tính)"
    types: [kho, tu_choi]

prices:             # USD / 1 triệu token — nguồn từ trang giá chính thức của từng provider
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "https://openai.com/api/pricing/ · xem 27/11/2026 — Input: $0.150/1M tokens, Output: $0.600/1M tokens"

  - model: gpt-4o
    input: 2.50
    output: 10.00
    source: "https://openai.com/api/pricing/ · xem 27/11/2026 — Input: $2.500/1M tokens, Output: $10.000/1M tokens"

usd_to_vnd:         # tỷ giá USD/VND để in thêm tiền Việt trong bản tóm tắt
  rate: 25400
  source: "Tỷ giá Vietcombank ngày 27/11/2026 (tự ước tính từ tỷ giá thị trường)"
